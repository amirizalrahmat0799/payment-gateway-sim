server:
  port: 8084
  # Finish in-flight requests when Kubernetes sends SIGTERM
  shutdown: graceful

spring:
  lifecycle:
    timeout-per-shutdown-phase: 20s
  application:
    name: settlement-service
  datasource:
    url: jdbc:postgresql://localhost:5432/settlement_db
    username: pgs
    password: pgs
  batch:
    job:
      enabled: false          # jobs are launched by the scheduler or the REST endpoint, not at startup
    jdbc:
      initialize-schema: always
  kafka:
    bootstrap-servers: localhost:29092
    consumer:
      group-id: settlement-service
      auto-offset-reset: earliest

settlement:
  # 00:05 UTC every day: settle everything up to the end of the previous day
  cron: "0 5 0 * * *"
  chunk-size: 50

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      # /actuator/health/liveness and /actuator/health/readiness for Kubernetes probes
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
