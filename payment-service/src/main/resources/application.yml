server:
  port: 8082
  # Finish in-flight requests when Kubernetes sends SIGTERM
  shutdown: graceful

spring:
  lifecycle:
    timeout-per-shutdown-phase: 20s
  application:
    name: payment-service
  datasource:
    url: jdbc:postgresql://localhost:5432/payment_db
    username: pgs
    password: pgs
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  kafka:
    bootstrap-servers: localhost:29092
    producer:
      acks: all
      properties:
        enable.idempotence: true

clients:
  merchant:
    base-url: http://localhost:8081
  tokenization:
    base-url: http://localhost:8083

outbox:
  poll-interval-ms: 1000
  batch-size: 50

issuer:
  # Authorizations above this amount (minor units) are declined: 5,000,000 = 50,000.00
  max-amount: 5000000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      # /actuator/health/liveness and /actuator/health/readiness for Kubernetes probes
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
