server:
  port: 8083
  # Finish in-flight requests when Kubernetes sends SIGTERM
  shutdown: graceful

spring:
  lifecycle:
    timeout-per-shutdown-phase: 20s
  application:
    name: tokenization-service
  datasource:
    url: jdbc:postgresql://localhost:5432/token_db
    username: pgs
    password: pgs
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

# DEV-ONLY keys. In production these come from a KMS / HSM / secrets manager, never from config files.
vault:
  encryption-key: ${VAULT_ENCRYPTION_KEY:corJQ8t0A3/fSmfWZTgYpXQm+fzLqwomJcj7DnEbxW4=}
  fingerprint-key: ${VAULT_FINGERPRINT_KEY:SZpjUY1zPCZLglePybkXidyWVtFnnKTUxQw54Z65UL0=}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      # /actuator/health/liveness and /actuator/health/readiness for Kubernetes probes
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
